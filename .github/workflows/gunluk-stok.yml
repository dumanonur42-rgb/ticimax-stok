name: Gunluk stok guncellemesi

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gunluk-stok
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Talha B2B senkron
        env:
          TALHA_B2B_USER: ${{ secrets.TALHA_B2B }}
          TALHA_B2B_PASS: ${{ secrets.TALHA_B2B_PASS }}
        run: python3 sync.py
      - name: Ciktilari kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output state.json
          if git diff --cached --quiet; then
            echo "Degisiklik yok"
          else
            git commit -m "Gunluk stok guncellemesi $(TZ=Europe/Istanbul date +%F)"
            git push origin HEAD:main
          fi
