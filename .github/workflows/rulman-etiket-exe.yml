name: Rulman Etiket Windows EXE

on:
  push:
    paths:
      - "rulman_etiket/**"
      - ".github/workflows/rulman-etiket-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rulman-etiket-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        working-directory: rulman_etiket
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf python-barcode pillow pyinstaller pywin32 zxing-cpp==3.0.0
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Derle
        working-directory: rulman_etiket
        shell: pwsh
        run: |
          $collectArgs = @()
          foreach ($module in @("pylibdmtx", "ppf.datamatrix", "treepoem", "segno", "zxingcpp")) {
            python -c "import importlib.util,sys; sys.exit(0 if importlib.util.find_spec('$module') else 1)"
            if ($LASTEXITCODE -eq 0) { $collectArgs += @("--collect-all", $module) }
          }
          pyinstaller --noconfirm --onefile --windowed --name "Rulman.Etiket" `
            --icon assets\icon.ico `
            --add-data "fonts;fonts" `
            --add-data "assets;assets" `
            --hidden-import win32print --hidden-import win32ui --hidden-import win32con --hidden-import pywintypes `
            --collect-all pymupdf --collect-all barcode @collectArgs `
            rulman_etiket.py

      - name: GDI yazdırma birim testleri
        working-directory: rulman_etiket
        run: python test/yazdirma_gdi_test.py

      - name: Oluşturulan PDF'leri dene
        timeout-minutes: 5
        working-directory: rulman_etiket
        shell: pwsh
        run: |
          function Invoke-RulmanEtiketSmoke {
            param(
              [string[]]$Arguments,
              [string]$FailureMessage
            )

            $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = Join-Path $PWD "dist\Rulman.Etiket.exe"
            $startInfo.WorkingDirectory = $PWD.Path
            $startInfo.UseShellExecute = $false
            foreach ($argument in $Arguments) {
              $null = $startInfo.ArgumentList.Add($argument)
            }
            $p = [System.Diagnostics.Process]::Start($startInfo)
            $null = $p.Handle
            if (-not $p.WaitForExit(60000)) {
              Get-CimInstance Win32_Process | Format-Table ProcessId, ParentProcessId, Name, CommandLine -AutoSize | Out-String -Width 400 | Write-Host
              try {
                $p.Kill($true)
              } catch {
                Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
                & taskkill.exe /F /T /PID $p.Id | Out-Null
              }
              throw "$FailureMessage 60 saniyede bitmedi"
            }
            if ($p.ExitCode -ne 0) {
              throw "$FailureMessage (çıkış kodu: $($p.ExitCode))"
            }
          }

          $etiket = "$PWD\test_cikti.pdf"
          Invoke-RulmanEtiketSmoke -Arguments @("--kod", "6308-C-2HRS", "--ek", "C3", "--adet", "1", "--pdf", $etiket) -FailureMessage "PDF oluşturma başarısız"
          if (-not (Test-Path $etiket) -or (Get-Item $etiket).Length -le 0) { Write-Error "PDF dosyası oluşmadı"; exit 1 }

          $surekli = "$PWD\test_surekli.pdf"
          Invoke-RulmanEtiketSmoke -Arguments @("--kod", "6308-C-2HRS", "--boyut", "62surekli", "--pdf", $surekli) -FailureMessage "Sürekli etiket PDF oluşturma başarısız"
          if (-not (Test-Path $surekli) -or (Get-Item $surekli).Length -le 0) { Write-Error "Sürekli etiket PDF dosyası oluşmadı"; exit 1 }

          $kucuk = "$PWD\test_kucuk.pdf"
          Invoke-RulmanEtiketSmoke -Arguments @("--kod", "6318-2Z", "--ek", "C3", "--boyut", "62x25", "--pdf", $kucuk) -FailureMessage "62x25 etiket PDF oluşturma başarısız"
          if (-not (Test-Path $kucuk) -or (Get-Item $kucuk).Length -le 0) { Write-Error "62x25 etiket PDF dosyası oluşmadı"; exit 1 }

          $kucuk35 = "$PWD\test_kucuk35.pdf"
          Invoke-RulmanEtiketSmoke -Arguments @("--kod", "6318-2Z", "--ek", "C3", "--boyut", "62x35", "--pdf", $kucuk35) -FailureMessage "62x35 etiket PDF oluşturma başarısız"
          if (-not (Test-Path $kucuk35) -or (Get-Item $kucuk35).Length -le 0) { Write-Error "62x35 etiket PDF dosyası oluşmadı"; exit 1 }

          $kucuk62 = "$PWD\test_kucuk62.pdf"
          Invoke-RulmanEtiketSmoke -Arguments @("--kod", "6308-C-2HRS", "--ek", "C3", "--barkod", "8691234567890", "--bilgi1", "LOT-123", "--bilgi2", "MADE IN TURKEY", "--boyut", "62x62", "--pdf", $kucuk62) -FailureMessage "62x62 etiket PDF oluşturma başarısız"
          if (-not (Test-Path $kucuk62) -or (Get-Item $kucuk62).Length -le 0) { Write-Error "62x62 etiket PDF dosyası oluşmadı"; exit 1 }

          $ean = "$PWD\test_ean.pdf"
          Invoke-RulmanEtiketSmoke -Arguments @("--kod", "6205-2RS", "--barkod", "8691234567890", "--pdf", $ean) -FailureMessage "EAN-13 PDF oluşturma başarısız"
          if (-not (Test-Path $ean) -or (Get-Item $ean).Length -le 0) { Write-Error "EAN-13 PDF dosyası oluşmadı"; exit 1 }

          $kontrolRapor = Join-Path $PWD "kontrol.txt"
          Remove-Item $kontrolRapor -ErrorAction SilentlyContinue
          try {
            Invoke-RulmanEtiketSmoke -Arguments @("--kontrol", "--rapor", $kontrolRapor) -FailureMessage "Uygulama dosyaları denetimden geçemedi"
          } finally {
            if (Test-Path $kontrolRapor) {
              Get-Content $kontrolRapor -Encoding utf8 | Write-Host
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Rulman Etiket
          path: |
            rulman_etiket/dist/Rulman.Etiket.exe
            rulman_etiket/test_cikti.pdf
            rulman_etiket/test_surekli.pdf
            rulman_etiket/kontrol.txt

      - name: Son sürüm etiketini güncelle
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f rulman-etiket-latest $env:GITHUB_SHA
          git push -f origin refs/tags/rulman-etiket-latest

      - name: Son sürüm (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rulman-etiket-latest
          name: Rulman Etiket QL-550
          body: "Brother QL-550 rulman kutu etiketi uygulaması."
          prerelease: false
          files: "rulman_etiket/dist/Rulman.Etiket.exe"

      - name: Deneme sürümü etiketini güncelle
        if: github.ref != 'refs/heads/main'
        run: |
          git tag -f rulman-etiket-test $env:GITHUB_SHA
          git push -f origin refs/tags/rulman-etiket-test

      - name: Deneme sürümü (dal)
        if: github.ref != 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rulman-etiket-test
          target_commitish: ${{ github.sha }}
          name: Rulman Etiket QL-550 (test sürümü)
          body: "Henüz yayımlanmamış deneme sürümü. Commit: ${{ github.sha }}"
          prerelease: true
          files: "rulman_etiket/dist/Rulman.Etiket.exe"
