name: Rulman Etiket Windows EXE

on:
  push:
    paths:
      - "rulman_etiket/**"
      - ".github/workflows/rulman-etiket-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rulman-etiket-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        working-directory: rulman_etiket
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf python-barcode pillow pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: SumatraPDF indir
        working-directory: rulman_etiket
        run: |
          $v = "3.5.2"
          Invoke-WebRequest -Uri "https://www.sumatrapdfreader.org/dl/rel/$v/SumatraPDF-$v-64.zip" -OutFile sumatra.zip
          Expand-Archive sumatra.zip -DestinationPath sumatra -Force
          Copy-Item (Get-ChildItem sumatra -Recurse -Filter "SumatraPDF*.exe" | Select-Object -First 1).FullName SumatraPDF.exe
          if (-not (Test-Path SumatraPDF.exe)) { Write-Error "SumatraPDF bulunamadı"; exit 1 }

      - name: Derle
        working-directory: rulman_etiket
        shell: pwsh
        run: |
          $collectArgs = @()
          foreach ($module in @("pylibdmtx", "ppf.datamatrix", "treepoem", "segno", "zxingcpp")) {
            python -c "import importlib.util,sys; sys.exit(0 if importlib.util.find_spec('$module') else 1)"
            if ($LASTEXITCODE -eq 0) { $collectArgs += @("--collect-all", $module) }
          }
          pyinstaller --noconfirm --onefile --windowed --name "Rulman Etiket" `
            --icon assets\icon.ico `
            --add-data "fonts;fonts" `
            --add-data "assets;assets" `
            --add-binary "SumatraPDF.exe;." `
            --collect-all pymupdf --collect-all barcode @collectArgs `
            rulman_etiket.py

      - name: Oluşturulan PDF'leri dene
        working-directory: rulman_etiket
        run: |
          $etiket = "$PWD\test_cikti.pdf"
          $p = Start-Process -FilePath ".\dist\Rulman Etiket.exe" -ArgumentList "--kod 6308-C-2HRS --ek C3 --adet 1 --pdf `"$etiket`"" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { Write-Error "PDF oluşturma başarısız: $($p.ExitCode)"; exit 1 }
          if (-not (Test-Path $etiket) -or (Get-Item $etiket).Length -le 0) { Write-Error "PDF dosyası oluşmadı"; exit 1 }

          $surekli = "$PWD\test_surekli.pdf"
          $s = Start-Process -FilePath ".\dist\Rulman Etiket.exe" -ArgumentList "--kod 6308-C-2HRS --boyut 62surekli --pdf `"$surekli`"" -Wait -PassThru -NoNewWindow
          if ($s.ExitCode -ne 0) { Write-Error "Sürekli etiket PDF oluşturma başarısız: $($s.ExitCode)"; exit 1 }
          if (-not (Test-Path $surekli) -or (Get-Item $surekli).Length -le 0) { Write-Error "Sürekli etiket PDF dosyası oluşmadı"; exit 1 }

          $k = Start-Process -FilePath ".\dist\Rulman Etiket.exe" -ArgumentList "--kontrol" -Wait -PassThru -NoNewWindow
          if ($k.ExitCode -ne 0) { Write-Error "Uygulama dosyaları denetimden geçemedi"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: Rulman Etiket
          path: |
            rulman_etiket/dist/Rulman Etiket.exe
            rulman_etiket/test_cikti.pdf
            rulman_etiket/test_surekli.pdf

      - name: Son sürüm (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rulman-etiket-latest
          name: Rulman Etiket QL-550
          body: "Brother QL-550 rulman kutu etiketi uygulaması."
          prerelease: false
          files: "rulman_etiket/dist/Rulman Etiket.exe"

      - name: Deneme sürümü (dal)
        if: github.ref != 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rulman-etiket-test
          target_commitish: ${{ github.sha }}
          name: Rulman Etiket QL-550 (test sürümü)
          body: "Henüz yayımlanmamış deneme sürümü. Commit: ${{ github.sha }}"
          prerelease: true
          files: "rulman_etiket/dist/Rulman Etiket.exe"
