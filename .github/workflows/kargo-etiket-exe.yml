name: Kargo Etiket Windows EXE

on:
  push:
    paths:
      - "kargo_etiket/**"
      - ".github/workflows/kargo-etiket-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklar
        run: |
          python -m pip install --upgrade pip
          pip install -r kargo_etiket/requirements.txt pyinstaller

      - name: SumatraPDF indir (gomulu PDF goruntuleyici/yazdirici)
        working-directory: kargo_etiket
        run: |
          $v = "3.5.2"
          Invoke-WebRequest -Uri "https://www.sumatrapdfreader.org/dl/rel/$v/SumatraPDF-$v-64.zip" -OutFile sumatra.zip
          Expand-Archive sumatra.zip -DestinationPath sumatra -Force
          Copy-Item (Get-ChildItem sumatra -Recurse -Filter "SumatraPDF*.exe" | Select-Object -First 1).FullName SumatraPDF.exe
          if (-not (Test-Path SumatraPDF.exe)) { Write-Error "SumatraPDF bulunamadi"; exit 1 }

      - name: Derle
        working-directory: kargo_etiket
        run: |
          pyinstaller --noconfirm --onefile --windowed --name KargoEtiket_QL550 `
            --icon assets\icon.ico `
            --add-data "fonts;fonts" `
            --add-data "assets\icon.ico;assets" `
            --add-data "assets\icon_48.png;assets" `
            --add-data "assets\icon_256.png;assets" `
            --add-binary "SumatraPDF.exe;." `
            --collect-all pymupdf --collect-all barcode --collect-all tkinterdnd2 `
            kargo_etiket.py

      - name: Test (ornek PDF)
        working-directory: kargo_etiket
        run: |
          # Pencereli (GUI) exe olduğu için PowerShell beklemez; -Wait şart.
          $p = Start-Process -FilePath .\dist\KargoEtiket_QL550.exe -ArgumentList "test\ornek.pdf","--acma" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { Write-Error "exe cikis kodu $($p.ExitCode)"; exit 1 }
          if (-not (Test-Path test\ornek_QL550.pdf)) { Write-Error "cikti olusmadi"; exit 1 }
          $k = Start-Process -FilePath .\dist\KargoEtiket_QL550.exe -ArgumentList "--kontrol" -Wait -PassThru -NoNewWindow
          if ($k.ExitCode -ne 0) { Write-Error "gomulu SumatraPDF exe icinde bulunamadi"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: KargoEtiket_QL550
          path: kargo_etiket/dist/KargoEtiket_QL550.exe

      - name: Release (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kargo-etiket-latest
          name: Kargo Etiket QL-550 (son surum)
          body: "Ticimax kargo barkod PDF -> Brother QL-550 etiket donusturucu. KargoEtiket_QL550.exe dosyasini indirip PDF'i uzerine surukleyin."
          prerelease: false
          files: kargo_etiket/dist/KargoEtiket_QL550.exe
