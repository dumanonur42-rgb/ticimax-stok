name: Yamansa Panel Windows exe

on:
  workflow_dispatch:
  push:
    paths:
      - "sosyal_medya/panel/**"
      - ".github/workflows/panel-exe.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sosyal_medya/panel/requirements.txt pyinstaller
      - name: PyInstaller
        working-directory: sosyal_medya/panel
        run: python -m PyInstaller --noconfirm --clean YamansaPanel.spec
      - name: Chromium'u pakete göm (kullanıcı hiçbir tarayıcı kurmaz)
        working-directory: sosyal_medya/panel
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "$PWD\dist\YamansaPanel\_internal\tarayicilar"
          python -m playwright install chromium
          Get-ChildItem $env:PLAYWRIGHT_BROWSERS_PATH | Format-Table Name, LastWriteTime -AutoSize | Out-String | Write-Host
          $mb = [math]::Round((Get-ChildItem dist\YamansaPanel -Recurse | Measure-Object Length -Sum).Sum / 1MB)
          Write-Host "Paket boyutu: $mb MB"
      - name: Duman testi (--dogrula, --ajan-tek)
        working-directory: sosyal_medya/panel/dist/YamansaPanel
        timeout-minutes: 8
        run: |
          function Calistir($arg, $sn) {
            $p = Start-Process -FilePath .\YamansaPanel.exe -ArgumentList $arg -PassThru
            if (-not $p.WaitForExit($sn * 1000)) {
              Write-Host "$arg : $sn sn icinde bitmedi, olduruluyor (muhtemelen hata penceresi)"
              Get-Process | Where-Object { $_.MainWindowTitle } | Format-Table Id, ProcessName, MainWindowTitle -AutoSize | Out-String | Write-Host
              Stop-Process -Id $p.Id -Force
              return 99
            }
            return $p.ExitCode
          }
          $kod = Calistir '--dogrula' 120
          Write-Host "dogrula exit: $kod"
          Get-Content dogrula.txt -ErrorAction SilentlyContinue
          Remove-Item dogrula.txt -ErrorAction SilentlyContinue
          if ($kod -ne 0) { exit 1 }
          $kod = Calistir '--ajan-tek' 180
          Write-Host "ajan-tek exit: $kod"
          Get-Content "$env:LOCALAPPDATA\YamansaPanel\ajan.log" -ErrorAction SilentlyContinue
          if ($kod -gt 1) { exit 1 }
      - name: Paket
        working-directory: sosyal_medya/panel/dist
        run: |
          @"
          YAMANSA SOSYAL MEDYA PANELI (.exe)

          KURULUM (2 adim; Chrome/Opera vb. KURMANIZ GEREKMEZ, tarayici uygulamanin icinde gelir):
          1) ZIP'i bir klasore cikarin, YamansaPanel\YamansaPanel.exe'ye cift tiklayin (Python gerekmez).
             Windows "Bilinmeyen yayimci" uyarisi verirse: Ek bilgi > Yine de calistir.
          2) Acilan HESAPLAR sayfasinda "KURULUMU BASLAT" deyin: Facebook ve Instagram sekmeleri acilir,
             ikisine de kendiniz giris yapin, pencereyi kapatin. Girisler dogrulanir ve otomatik baslatma
             kendiliginden kurulur. Bitti; paneli kapatabilirsiniz.

          ZAMANLAYICI sayfasi: saatler 09:00 / 12:30 / 18:30 (degistirebilirsiniz).
             Panel kapaliyken de arka plan ajani paylasimlari atar.
             PC UYKU MODUNDAYSA: Gorev Zamanlayici paylasim saatlerinde PC'yi uyandirir, paylasir,
             PC tekrar uyur. Bunun icin Guc Secenekleri > Gelismis > Uyku > "Uyandirma zamanlayicilarina
             izin ver" ETKIN olmali (kurulum bunu otomatik acmayi dener). Dizustu kapagi kapaliyken
             uyanmaz; TAMAMEN KAPALI PC hic uyandirilamaz.
             Kacirilan paylasimlar PC acilinca 3 saat icindeyse (Gecikme toleransi) telafi edilir.
          FACEBOOK GRUPLARI: grup turlari varsayilan KAPALI; once "Deneme turu" ile bakin.

          Veriler: %LOCALAPPDATA%\YamansaPanel (ayarlar, loglar, ekran goruntuleri, profil)
          "@ | Set-Content YamansaPanel\OKU_BENI.txt
          Compress-Archive -Path YamansaPanel -DestinationPath YamansaPanel_exe.zip
      - uses: actions/upload-artifact@v4
        with:
          name: YamansaPanel_exe
          path: sosyal_medya/panel/dist/YamansaPanel_exe.zip
