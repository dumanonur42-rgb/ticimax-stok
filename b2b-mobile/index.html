<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b2a5b" />
    <meta name="description" content="Yamansa Rulman bayi ürün, stok ve sipariş uygulaması." />
    <title>Yamansa Rulman B2B</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var match = navigator.userAgent.match(/Chrome\/(\d+)/);
        if (!match || parseInt(match[1], 10) >= 84) return;

        document.documentElement.setAttribute('data-legacy-webview', 'true');
        var root = document.getElementById('root');
        if (root) root.style.display = 'none';

        var screen = document.createElement('main');
        screen.id = 'legacy-webview-update';
        screen.style.cssText = 'position:fixed;z-index:2147483647;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;overflow:auto;padding:28px 22px;background:#f3f6fa;color:#16243a;font-family:Arial,sans-serif;text-align:center;';

        var card = document.createElement('section');
        card.style.cssText = 'width:100%;max-width:420px;padding:28px 22px;border:1px solid #e2e8f0;border-radius:18px;background:#fff;box-shadow:0 14px 42px rgba(15,42,80,.12);';

        var title = document.createElement('h1');
        title.textContent = 'Uygulama güncellemesi gerekli';
        title.style.cssText = 'margin:0 0 16px;font-size:22px;line-height:1.3;';

        var message = document.createElement('p');
        message.textContent = "Uygulamanın çalışması için telefonunuzdaki 'Android System WebView' uygulamasının güncellenmesi gerekiyor.";
        message.style.cssText = 'margin:0 0 24px;color:#526176;font-size:16px;line-height:1.55;';

        var button = document.createElement('button');
        button.id = 'legacy-webview-update-button';
        button.type = 'button';
        button.textContent = 'Güncelle';
        button.style.cssText = 'min-height:48px;width:100%;padding:12px 18px;border:0;border-radius:12px;background:#0b2a5b;color:#fff;font-size:16px;font-weight:bold;';

        card.appendChild(title);
        card.appendChild(message);
        card.appendChild(button);
        screen.appendChild(card);
        document.body.appendChild(screen);
      })();
    </script>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
